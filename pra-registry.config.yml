# ============================================================================
# PRA Registry Configuration — Single Source of Truth
# ============================================================================
#
# Ce fichier centralise toutes les valeurs de configuration du registre PRA.
# Il est consommé par :
#   - Les agents IA (Claude Code agents, GitHub Copilot agents)
#   - Les workflows GitHub Actions
#   - Les scripts de build (dashboard, Confluence Publisher, GitHub Pages)
#
# RÈGLE : Si une valeur est référencée à plus d'un endroit, elle doit être ici.
# Ne jamais hardcoder ces valeurs ailleurs — toujours lire ce fichier.
# ============================================================================

# --- Format de contenu ---
content_format: adoc

# --- Chemins du contenu ---
paths:
  pras: content/pras             # Racine des PRAs (toutes langues)
  guides: content/guides         # Racine des guides utilisateur
  docs: docs                     # Documentation technique
  templates: templates           # Templates PRA/ADR

# --- Langues ---
languages:
  primary: fr
  secondary: en

# --- Scopes ---
scopes:
  - bank-wide                    # PRAs transversaux (tous domaines)
  - domain-wide                  # PRAs spécifiques à un domaine

# --- Archétypes (dossiers de classification principale) ---
# Ajouter un archétype = ajouter ici + créer le dossier correspondant
# Les sous-catégories sont libres (attribut :pra-subcategory: dans le fichier)
archetypes:
  - integration       # API, messaging, event-driven, ETL
  - application       # design patterns, microservices, frontend
  - data              # data management, pipelines, analytics
  - security          # auth, encryption, network security
  - technology        # infra, cloud, containers, networking
  - devops            # CI/CD, observabilité, IaC, platform engineering
  - business          # processus métier, workflows, patterns domaine

# --- Gouvernance ---
governance:
  # Promotion operationalizing → operationalized
  promotion:
    min_proven_in_use: 3
    min_teams: 2
    min_months_as_candidate: 6
    min_months_stable: 3
    required_approvals: 2

  # Deprecation
  deprecation:
    months_inactive_warning: 6
    months_inactive_critical: 12
    transition_period_months: 6

  # Review
  review:
    domain_review_days: 10       # Max jours pour review domaine
    bankwide_review_weeks: 4     # Max semaines pour review bank-wide
    promotion_review_weeks: 8    # Max semaines pour review promotion

  # Comités
  committees:
    domain:
      min_members: 3
      max_members: 5
    experts:
      min_members: 5
      max_members: 7

# --- Qualité ---
quality:
  scoring:
    completeness: 40             # % du score
    clarity: 30
    utility: 20
    maintenance: 10
  min_adr_count: 1
  min_adr_options_compared: 2
  min_proven_in_use_candidate: 1
  min_proven_in_use_approved: 3
  review_frequency: annual       # Fréquence de review des PRAs operationalized

# --- Statuts ---
# Le statut est UNIQUEMENT dans les attributs AsciiDoc (:pra-status:)
# Il n'y a plus de dossiers de statut dans l'arborescence
statuses:
  candidate:
    name: operationalizing
    label_fr: "En cours d'opérationnalisation"
    label_en: "Operationalizing"
  approved:
    name: operationalized
    label_fr: "Opérationnalisé"
    label_en: "Operationalized"
  deprecated:
    name: deprecated
    label_fr: "Déprécié"
    label_en: "Deprecated"

# --- Publication ---
confluence:
  cloud:
    url: "${CONFLUENCE_URL}"
    space_key: "${CONFLUENCE_SPACE_KEY}"
    ancestor_id_fr: "${CONFLUENCE_ANCESTOR_FR}"
    ancestor_id_en: "${CONFLUENCE_ANCESTOR_EN}"
  data_center:
    url: ""
    space_key: ""
    ancestor_id_fr: ""
    ancestor_id_en: ""

github_pages:
  enabled: true
  base_url: /proven-reusable-architecture

# --- GitHub ---
github:
  org: KiyaliHQ
  repo: proven-reusable-architecture
  teams:
    development: pra-development-team
    experts: comite-architectes-experts
    domain_prefix: comite-gov     # Ex: comite-gov-particuliers
  labels:
    scope_prefix: "scope:"
    archetype_prefix: "archetype:"
    type_prefix: "type:"
  branch_naming: "pra/{type}-{name}"  # Ex: pra/nouveau-integration-api-gateway
